[package]
name = "checkle"
version = "0.2.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "Extremely fast checksum runner for arbitrarily large batches of files"
repository = "https://github.com/nrminor/checkle"
homepage = "https://github.com/nrminor/checkle"
documentation = "https://github.com/nrminor/checkle/blob/main/README.md"
keywords = ["science", "reproducibility", "bioinformatics", "data"]
categories = ["command-line-utilities", "science"]

[features]
default = ["archives"]
archives = ["tar", "zip"]
tar-only = ["tar"]
zip-only = ["zip"]

[[bin]]
name = "checkle"
path = "src/main.rs"

[[bench]]
name = "criterion_benchmarks"
harness = false

[dependencies]
clap = { version = "4.4.3", features = ["derive", "cargo"]}
clap-verbosity-flag = "2.1.1"
sha2 = "0.10.8"
color-eyre = "0.6.3"
rayon = "1.10.0"
digest = "0.10.7"
md-5 = "0.10.6"
thiserror = "2.0.12"
fern = { version = "0.7.1", features = ["colored"] }
log = "0.4.27"
jiff = { version = "0.2.6", features = ["logging"] }
crossbeam = "0.8.4"
ignore = "0.4.23"
indicatif = "0.17.9"
prettytable-rs = "0.10.0"
tar = { version = "0.4.40", optional = true }
zip = { version = "0.6.6", optional = true, features = ["deflate", "bzip2"] }
hex = "0.4.3"
clap_complete = "4.5.0"

[profile.dev]
incremental = true
lto = false

[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1
incremental = true
panic = "abort"
# strip = "symbols"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.19.1"
proptest = "1.4.0"
criterion = "0.5.1"
rstest = "0.18.2"
assert_cmd = "2.0.13"
predicates = "3.1.0"
regex = "1.10.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

