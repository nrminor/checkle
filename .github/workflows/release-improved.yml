name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # Quick validation before building
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Expected vX.Y.Z"
            exit 1
          fi

  create-release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << EOF > release_notes.md
          ## Release ${{ github.ref_name }}
          
          This release includes SIMD-optimized binaries for improved performance on modern CPUs.
          
          ### Binary Types
          - **Standard binaries**: Built with stable Rust, maximum compatibility
          - **SIMD binaries**: Built with nightly Rust and SIMD optimizations, ~10-20x faster hash validation
          
          Choose SIMD binaries if your CPU supports:
          - x86_64: AVX2 (Intel/AMD from 2013+)
          - ARM64: NEON (all ARM64 CPUs)
          
          ### Installation
          
          Download the appropriate binary for your platform and extract it:
          
          \`\`\`bash
          # Linux/macOS
          tar -xzf checkle-*.tar.gz
          chmod +x checkle
          sudo mv checkle /usr/local/bin/
          
          # Windows
          # Extract the zip file and add to PATH
          \`\`\`
          EOF
      
      - name: Create GitHub Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            --draft

  build-release:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Define a more maintainable matrix structure
          # Linux x86_64
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_zigbuild: true
          - name: linux-x64-simd
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: simd
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
            use_zigbuild: true
          
          # Linux ARM64
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_zigbuild: true
          - name: linux-arm64-simd
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            features: simd
            rustflags: "-C target-feature=+neon"
            use_zigbuild: true
          
          # macOS Intel
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
          - name: macos-x64-simd
            os: macos-13
            target: x86_64-apple-darwin
            features: simd
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
          
          # macOS ARM64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-arm64-simd
            os: macos-latest
            target: aarch64-apple-darwin
            features: simd
            rustflags: "-C target-feature=+neon"
          
          # Windows x86_64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-x64-simd
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: simd
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.features == 'simd' && 'nightly' || 'stable' }}
          targets: ${{ matrix.target }}
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      
      # Linux cross-compilation setup
      - name: Setup cross-compilation
        if: matrix.use_zigbuild
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      
      # Build
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [[ "${{ matrix.use_zigbuild }}" == "true" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }} ${{ matrix.features && '--features' || '' }} ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }} ${{ matrix.features && '--features' || '' }} ${{ matrix.features }}
          fi
        shell: bash
      
      # Package
      - name: Package
        id: package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a ../../../checkle-${{ matrix.name }}.zip checkle.exe
            echo "asset_path=checkle-${{ matrix.name }}.zip" >> $GITHUB_OUTPUT
          else
            tar czf ../../../checkle-${{ matrix.name }}.tar.gz checkle
            echo "asset_path=checkle-${{ matrix.name }}.tar.gz" >> $GITHUB_OUTPUT
          fi
      
      # Upload
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.package.outputs.asset_path }}" \
            --clobber

  finalize-release:
    name: Finalize Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false