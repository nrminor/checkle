name: CI (SIMD Nightly)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'justfile'
      - '.github/workflows/ci-simd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'justfile'
      - '.github/workflows/ci-simd.yml'
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test SIMD feature on nightly
  simd-test:
    name: SIMD Tests (Nightly)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows builds commented out due to compatibility issues
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check SIMD feature
        run: cargo check --features simd
      - name: Test SIMD implementation
        run: cargo test --features simd --test simd_correctness_tests
        env:
          RUSTFLAGS: "-C target-cpu=native"
      - name: Test all with SIMD
        run: cargo test --features simd -- --test-threads=1
        env:
          RUSTFLAGS: "-C target-cpu=native"

  simd-clippy:
    name: Clippy SIMD (Nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy SIMD
        run: cargo clippy --features simd --all-targets -- -D warnings

  simd-build:
    name: Build SIMD (Nightly)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # x86_64 builds with AVX2 (widely supported)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
          # Windows builds commented out due to compatibility issues
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
          # macOS Intel with AVX2
          - os: macos-13  # Intel runner
            target: x86_64-apple-darwin
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
          # macOS ARM64 with NEON (all ARM64 have NEON)
          - os: macos-latest  # M1 runner
            target: aarch64-apple-darwin
            rustflags: "-C target-feature=+neon"
          # Linux ARM64 with NEON (cross-compiled)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rustflags: "-C target-feature=+neon"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Setup uv
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        uses: astral-sh/setup-uv@v3
      - name: Install cargo-zigbuild
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build with SIMD (cross-compilation)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          source .venv/bin/activate
          cargo zigbuild --release --features simd --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Build with SIMD (native)
        if: "!(matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu')"
        run: cargo build --release --features simd --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Upload SIMD artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkle-simd-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/checkle
            target/${{ matrix.target }}/release/checkle.exe

  simd-bench:
    name: Benchmark SIMD
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: |
          cargo bench --bench hex_conversion_bench -- --save-baseline scalar-${{ matrix.os }}
          RUSTFLAGS="-C target-cpu=native" cargo bench --features simd --bench hex_conversion_bench -- --save-baseline simd-${{ matrix.os }}
      - name: Compare results
        run: cargo bench --bench hex_conversion_bench -- --load-baseline scalar-${{ matrix.os }} --baseline simd-${{ matrix.os }}