name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds using cargo-zigbuild
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use_zigbuild: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            use_zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            use_zigbuild: true
          
          # macOS builds using cargo-zigbuild
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            use_zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            use_zigbuild: true
          
          # Windows builds (native)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use_zigbuild: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            use_zigbuild: false

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Setup uv
        if: matrix.use_zigbuild
        uses: astral-sh/setup-uv@v3
      
      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          uv pip install --system ziglang
          cargo install --locked cargo-zigbuild
      
      - name: Build with cargo-zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}
      
      - name: Build with cargo
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf checkle-${{ matrix.target }}.tar.gz checkle
          mv checkle-${{ matrix.target }}.tar.gz ../../../
      
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path checkle.exe -DestinationPath ../../../checkle-${{ matrix.target }}.zip
      
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./checkle-${{ matrix.target }}.${{ matrix.archive }}
          asset_name: checkle-${{ matrix.target }}.${{ matrix.archive }}
          asset_content_type: application/octet-stream