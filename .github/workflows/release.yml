name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Run all CI checks before creating release
  ci-stable:
    name: CI Stable Checks
    uses: ./.github/workflows/ci-stable.yml

  ci-simd:
    name: CI SIMD Checks
    uses: ./.github/workflows/ci-simd.yml

  create-release:
    name: Create Release
    needs: [ci-stable, ci-simd]  # Only create release if all tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "## Release ${{ github.ref_name }}
            
This release includes SIMD-optimized binaries for improved performance on modern CPUs.

### Binary Types
- **Standard binaries**: Built with stable Rust, maximum compatibility
- **SIMD binaries**: Built with nightly Rust and SIMD optimizations, ~10-20x faster for hash validation

Choose SIMD binaries if your CPU supports AVX2 (Intel/AMD from 2013+) or NEON (all ARM64)."

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 - Standard
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            features: ""
            rustflags: ""
            suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            features: ""
            rustflags: ""
            suffix: ""
          
          # Linux x86_64 - SIMD
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            features: "simd"
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
            suffix: "-simd"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            features: "simd"
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
            suffix: "-simd"
          
          # Linux ARM64 - Standard
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            features: ""
            rustflags: ""
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            features: ""
            rustflags: ""
            suffix: ""
          
          # Linux ARM64 - SIMD
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            features: "simd"
            rustflags: "-C target-feature=+neon"
            suffix: "-simd"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            features: "simd"
            rustflags: "-C target-feature=+neon"
            suffix: "-simd"
          
          # macOS Intel - Standard
          - os: macos-13  # Intel runner
            target: x86_64-apple-darwin
            archive: tar.gz
            features: ""
            rustflags: ""
            suffix: ""
          
          # macOS Intel - SIMD
          - os: macos-13  # Intel runner
            target: x86_64-apple-darwin
            archive: tar.gz
            features: "simd"
            rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
            suffix: "-simd"
          
          # macOS ARM64 - Standard
          - os: macos-latest  # M1 runner
            target: aarch64-apple-darwin
            archive: tar.gz
            features: ""
            rustflags: ""
            suffix: ""
          
          # macOS ARM64 - SIMD
          - os: macos-latest  # M1 runner
            target: aarch64-apple-darwin
            archive: tar.gz
            features: "simd"
            rustflags: "-C target-feature=+neon"
            suffix: "-simd"
          
          # Windows builds commented out due to compatibility issues
          # # Windows x86_64 - Standard
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   archive: zip
          #   features: ""
          #   rustflags: ""
          #   suffix: ""
          # 
          # # Windows x86_64 - SIMD
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   archive: zip
          #   features: "simd"
          #   rustflags: "-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2"
          #   suffix: "-simd"
          # 
          # # Windows ARM64 - Standard
          # - os: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   archive: zip
          #   features: ""
          #   rustflags: ""
          #   suffix: ""
          # 
          # # Windows ARM64 - SIMD
          # - os: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   archive: zip
          #   features: "simd"
          #   rustflags: "-C target-feature=+neon"
          #   suffix: "-simd"

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust (stable for standard builds)
        if: matrix.features == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Rust (nightly for SIMD builds)
        if: matrix.features != ''
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      
      - name: Setup uv
        if: matrix.os == 'ubuntu-latest'
        uses: astral-sh/setup-uv@v3
      
      - name: Install cargo-zigbuild
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install ziglang
          cargo install --locked cargo-zigbuild
      
      - name: Build with cargo-zigbuild (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          source .venv/bin/activate
          if [ -n "${{ matrix.features }}" ]; then
            cargo zigbuild --release --features ${{ matrix.features }} --target ${{ matrix.target }}
          else
            cargo zigbuild --release --target ${{ matrix.target }}
          fi
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      
      - name: Build with cargo (macOS)
        if: matrix.os != 'ubuntu-latest' && matrix.os != 'windows-latest'
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --features ${{ matrix.features }} --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      
      - name: Build with cargo (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if ("${{ matrix.features }}" -ne "") {
            cargo build --release --features "${{ matrix.features }}" --target "${{ matrix.target }}"
          } else {
            cargo build --release --target "${{ matrix.target }}"
          }
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf checkle-${{ matrix.target }}${{ matrix.suffix }}.tar.gz checkle
          mv checkle-${{ matrix.target }}${{ matrix.suffix }}.tar.gz ../../../
      
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path checkle.exe -DestinationPath ../../../checkle-${{ matrix.target }}${{ matrix.suffix }}.zip
      
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "./checkle-${{ matrix.target }}${{ matrix.suffix }}.${{ matrix.archive }}" \
            --clobber